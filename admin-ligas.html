<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión de ligas | Futbol Metrics</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body class="admin-shell">
<div class="admin-layout">

<aside class="sidebar">
  <div class="sidebar-title">⚽ Futbol Metrics<br><small style="color:#9fc4b6">Administración</small></div>
  <nav>
    <a class="" href="admin.html">Dashboard</a>
    <a class="" href="admin-noticias.html">Noticias</a>
    <a class="" href="admin-partidos.html">Partidos</a>
    <a class="active" href="admin-ligas.html">Ligas</a>
    <a href="../index.html">Volver al sitio</a>
  </nav>
</aside>

<main class="admin-main">
<div class="admin-top"><div><h1>Gestión de ligas</h1><p class="meta">Administrar las competiciones de la plataforma.</p></div><a class="btn btn-primary" href="#formulario">+ Nueva liga</a></div>
<div id="formulario" class="form-card">
  <h2 style="color:var(--green-900);margin-bottom:15px">Registrar liga</h2>
  <div class="form-grid">
    <div class="form-group"><label>Nombre</label><input placeholder="LaLiga"></div>
    <div class="form-group"><label>País o región</label><input placeholder="España"></div>
    <div class="form-group full"><label>Descripción</label><input placeholder="Primera división de España"></div>
    <div class="form-group"><label>Logo</label><input placeholder="assets/laliga.png"></div>
    <div class="form-group"><label>Estado</label><select><option>Activa</option><option>Inactiva</option></select></div>
  </div><br><button class="btn btn-primary">Guardar liga</button>
</div>
<div class="table-wrap"><table><thead><tr><th>ID</th><th>Liga</th><th>País/Región</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>
<tr><td>1</td><td>LaLiga</td><td>España</td><td><span class="status">Activa</span></td><td><div class="actions"><button class="action-btn edit">Editar</button><button class="action-btn delete">Eliminar</button></div></td></tr>
<tr><td>2</td><td>Premier League</td><td>Inglaterra</td><td><span class="status">Activa</span></td><td><div class="actions"><button class="action-btn edit">Editar</button><button class="action-btn delete">Eliminar</button></div></td></tr>
<tr><td>3</td><td>Liga BetPlay</td><td>Colombia</td><td><span class="status">Activa</span></td><td><div class="actions"><button class="action-btn edit">Editar</button><button class="action-btn delete">Eliminar</button></div></td></tr>
</tbody></table></div>
</main>
</div>
<script src="../script.js"></script>
</body>
</html>
